<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Purple Sudoku</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="main-container">
        <header>
            <h1 class="vintage-title">VINTAGE PURPLE SUDOKU</h1>
        </header>
        <nav class="controls">
            <div class="difficulty-selectors">
                <button class="diff-btn active" id="easy-btn" data-difficulty="easy">Easy</button>
                <button class="diff-btn" id="medium-btn" data-difficulty="medium">Medium</button>
                <button class="diff-btn" id="hard-btn" data-difficulty="hard">Hard</button>
            </div>
            <button class="action-btn reset-btn" id="reset-button">Reset Grid</button>
        </nav>
        <main>
            <div class="sudoku-container">
                <div id="sudoku-grid" class="sudoku-grid">
                    </div>
            </div>
        </main>
        <footer>
            <p class="minimal-footer">A simple game in the dark. Enjoy the challenge.</p>
        </footer
    </div>
</body>
</html>
