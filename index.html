<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vintage Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="left-controls">
                <button id="reset-btn" aria-label="Reset Puzzle">↺</button>
                <button id="stats-btn" aria-label="View Stats">T</button>
            </div>
            <h1>Sudoku</h1>
            <select id="difficulty-select">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="extreme" selected>Extreme</option>
            </select>
        </header>
        
        <div class="status-bar">
            <span id="correct-display">0 CORRECT</span>
            <span id="diff-display">EXTREME</span>
            <span id="mistake-display">0 MISTAKES</span>
        </div>

        <div id="sudoku-board"></div>

        <div id="victory-screen" class="hidden fullscreen-overlay">
            <h2>Puzzle Solved!</h2>
            <button id="new-game-btn" class="primary-btn">New Game</button>
        </div>

        <div id="stats-screen" class="hidden fullscreen-overlay">
            <h2>Statistics</h2>
            <div class="stat-list">
                <div class="stat-row"><span>Easy Wins:</span> <span id="stat-easy">0</span></div>
                <div class="stat-row"><span>Medium Wins:</span> <span id="stat-medium">0</span></div>
                <div class="stat-row"><span>Hard Wins:</span> <span id="stat-hard">0</span></div>
                <div class="stat-row"><span>Extreme Wins:</span> <span id="stat-extreme">0</span></div>
            </div>
            <div class="overlay-buttons">
                <button id="close-stats-btn" class="primary-btn">Close</button>
                <button id="reset-stats-btn" class="danger-btn">Reset Stats</button>
            </div>
        </div>

        <div id="numpad">
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
