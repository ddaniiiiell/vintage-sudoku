<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vintage Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <button id="reset-btn" aria-label="Reset Puzzle">↺</button>
            <h1>Sudoku</h1>
            <select id="difficulty-select">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="extreme" selected>Extreme</option>
            </select>
        </header>
        
        <div class="status-bar">
            <span id="correct-display">0 CORRECT</span>
            <span id="diff-display">EXTREME</span>
            <span id="mistake-display">0 MISTAKES</span>
        </div>

        <div id="sudoku-board"></div>

        <div id="numpad">
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
